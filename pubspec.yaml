name: my_project
description: "A new Flutter project."

publish_to: 'none' 



environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  provider: ^6.1.5+1
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  path: ^1.9.1
  camera: ^0.12.1
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  widgets_to_image: ^2.0.1
  gal: ^2.3.3
  path_provider: ^2.1.6
  intl: ^0.20.3
  image_picker: ^1.2.4
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

flutter:


  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/vectors/
    - assets/images/

  fonts:
    - family: CircularStd
      fonts:
        - asset: assets/fonts/CircularStd-Black.ttf
          weight: 800
        - asset: assets/fonts/CircularStd-Bold.ttf
          weight: 700
        - asset: assets/fonts/CircularStd-Medium.ttf
          weight: 500
        - asset: assets/fonts/CircularStd-Regular.ttf
          weight: 400

